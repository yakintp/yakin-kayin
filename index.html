<!DOCTYPE html> 
<html lang="fr"> 
<head>
    <meta charset="utf-8"/>
    <title>Carte Fournisseurs Île-de-France</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f4; }
        .header { display: flex; align-items: center; background: white; padding: 10px 20px; border-radius: 8px; margin-bottom: 15px; }
        #map { height: 600px; border-radius: 8px; }
        .filters { margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px; display:flex; gap:10px; }
    </style>
</head>

<body>

<div class="header">
    <img src="logo.png" style="height:50px;">
    <h2>Carte Fournisseurs Île-de-France</h2>
</div>

<div class="filters">

    <!-- ✅ UNIQUEMENT FOURNISSEUR + PRODUIT -->
    <select id="filtreNom" onchange="filtrer()">
        <option value="">Fournisseur : Tous</option>
    </select>

    <select id="filtreProduit" onchange="filtrer()">
        <option value="">Produit : Tous</option>
    </select>

    <button onclick="location.reload()">Reset</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<script>

var map = L.map('map').setView([48.85, 2.35], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var markers = [];
var villesCoords = {};
var cercleRayon = null;

var codesCouleurs = {
    "Loxam": "blue",
    "Point P": "red",
    "Raboni": "green",
    "Cemex": "black",
    "Tersen": "orange"
};

function normalize(str){
    return str ? str.toString().toLowerCase().trim() : "";
}

fetch("data.csv")
.then(r => r.text())
.then(csv => {

    Papa.parse(csv, {
        header:true,
        skipEmptyLines:true,
        complete:function(results){

            let frsSet = new Set();
            let prodSet = new Set();

            results.data.forEach(row => {

                let f = row["fournisseur"]?.trim();
                let p = row["Produit"]?.trim();

                let lat = parseFloat(row["latitude (fournisseur)"]?.replace(",", "."));
                let lng = parseFloat(row["longitude (fournisseur)"]?.replace(",", "."));

                if(!f || isNaN(lat) || isNaN(lng)) return;

                frsSet.add(f);
                if(p) prodSet.add(p);

                let marker = L.marker([lat,lng]).addTo(map);

                marker.data = { f, p, lat, lng };

                markers.push(marker);
            });

            remplir("filtreNom", frsSet, "Fournisseur");
            remplir("filtreProduit", prodSet, "Produit");

            ajouterLegende();
        }
    });
});

function remplir(id,set,label){
    let s = document.getElementById(id);
    s.innerHTML = `<option value="">${label} : Tous</option>`;
    Array.from(set).sort().forEach(v=>{
        let o=document.createElement("option");
        o.value=v;
        o.textContent=v;
        s.appendChild(o);
    });
}

function ajouterLegende(fournisseurs = null){

    if(window.legend) map.removeControl(window.legend);

    let legend = L.control({position:'bottomright'});

    legend.onAdd = function(){

        let div = L.DomUtil.create('div','legend');
        div.innerHTML = "<b>Fournisseurs</b><br>";

        let list = fournisseurs || Object.keys(codesCouleurs);

        list.forEach(f=>{

            let span = document.createElement("span");
            span.innerHTML = f;

            span.onclick = () => {
                document.getElementById("filtreNom").value = f;
                filtrer();
            };

            div.appendChild(span);
        });

        return div;
    };

    legend.addTo(map);
    window.legend = legend;
}

function filtrer(){

    let nom = normalize(document.getElementById("filtreNom").value);
    let prod = normalize(document.getElementById("filtreProduit").value);

    let visibles = new Set();

    markers.forEach(m=>{

        let d = m.data;
        let ok = true;

        if(nom && normalize(d.f)!==nom) ok=false;
        if(prod && normalize(d.p)!==prod) ok=false;

        if(ok){
            m.addTo(map);
            visibles.add(d.f);
        } else {
            map.removeLayer(m);
        }
    });

    ajouterLegende(Array.from(visibles));
}

</script>

</body>
</html>
