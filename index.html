<!DOCTYPE html> 
<html lang="fr"> 
<head>
<meta charset="utf-8"/>
<title>Carte Fournisseurs Île-de-France</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { font-family: Arial; margin:0; padding:15px; background:#f4f4f4; }
.header { display:flex; align-items:center; background:#fff; padding:10px; border-radius:8px; margin-bottom:10px; }
#map { height:600px; border-radius:8px; }

.legend {
    background:#fff;
    padding:10px;
    border-radius:8px;
    width:250px;
    font-size:12px;
    max-height:400px;
    overflow:auto;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
}

.legend b { color:red; display:block; margin-bottom:8px; }

.legend-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:3px;
    cursor:pointer;
}

.legend-box{
    width:14px;
    height:14px;
    border-radius:3px;
}
</style>
</head>

<body>

<div class="header">
    <h2>Carte Fournisseurs</h2>
</div>

<div class="filters">
    <select id="filtreNom" onchange="filtrer()">
        <option value="">Fournisseur : Tous</option>
    </select>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<script>

var map = L.map('map').setView([48.85,2.35],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var markers=[];

var colors = {
    "Loxam":"blue",
    "Point P":"red",
    "Raboni":"green",
    "Cemex":"grey",
    "Tersen":"orange"
};

function getColor(f){
    return colors[f] || "blue";
}

fetch("data.csv")
.then(r=>r.text())
.then(csv=>{

Papa.parse(csv,{
    header:true,
    complete:function(res){

        let setF = new Set();

        res.data.forEach(r=>{

            let f=r["fournisseur"]?.trim();
            let lat=parseFloat(r["latitude (fournisseur)"]);
            let lng=parseFloat(r["longitude (fournisseur)"]);

            if(!f || isNaN(lat) || isNaN(lng)) return;

            setF.add(f);

            let m=L.marker([lat,lng]).addTo(map);
            m.data={f};
            markers.push(m);
        });

        remplir("filtreNom",setF);
        drawLegendFromDropdown(); // IMPORTANT
    }
});

});

function remplir(id,set){
    let s=document.getElementById(id);
    set.forEach(v=>{
        let o=document.createElement("option");
        o.value=v;
        o.textContent=v;
        s.appendChild(o);
    });
}

/* ✅ LÉGENDE = STRICTEMENT LE DROPDOWN */
function drawLegendFromDropdown(){

    if(window.legend) map.removeControl(window.legend);

    window.legend=L.control({position:'bottomright'});

    window.legend.onAdd=function(){

        let div=L.DomUtil.create("div","legend");

        div.innerHTML="<b>Fournisseurs</b>";

        let options=[...document.getElementById("filtreNom").options]
            .map(o=>o.value)
            .filter(v=>v); // supprime ""

        options.forEach(f=>{

            let item=document.createElement("div");
            item.className="legend-item";

            item.innerHTML=`
                <div class="legend-box" style="background:${getColor(f)}"></div>
                ${f}
            `;

            item.onclick=()=>{
                document.getElementById("filtreNom").value=f;
                filtrer();
            };

            div.appendChild(item);
        });

        return div;
    };

    window.legend.addTo(map);
}

function filtrer(){

    let f=document.getElementById("filtreNom").value;

    markers.forEach(m=>{
        if(!f || m.data.f===f){
            m.addTo(map);
        } else {
            map.removeLayer(m);
        }
    });

    drawLegendFromDropdown(); // sync
}

</script>

</body>
</html>
